name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUN_VERSION: '1.4.2'

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@818fe6ccacd5f5812e71e3b8e3bea65de812f6a9 # v0.11.153
        with:
          version: '0.11.92'
          install: 'false'
          packages: 'bun.com@${{ env.BUN_VERSION }}'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build
        run: bun run build

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
